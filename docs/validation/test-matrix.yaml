# i.MX 95 QEMU — canonical capability/test matrix (HUMAN-owned).
#
# Single source of truth for both renderings:
#   * docs/validation/test-result-matrix.md  (detailed; CI fills the result col)
#   * the README condensed capability table   (via readme_groups, injected between
#     the <!-- BEGIN/END capability-table --> markers)
#
# Tiers (fleet-canonical): A = data-path verified (data actually moves) ·
# B = driver bring-up / registration bar (binds, may soft-fail) · C = registration
# only (Linux sees + names it, compute is proprietary/out of scope).
#
# tests/gen-test-matrix.py --inject-readme regenerates the README table and
# verify_groups() FAILS if any present/absent block is un-grouped, double-grouped,
# or a group's tier disagrees with the block's — so the README table and this
# matrix physically cannot drift (fleet anti-drift guard, 91's pattern 446062f980).

soc: "i.MX 95"
board: "imx95-19x19-evk"
qemu_machine: "imx95-19x19-evk"

present:
  # --- CPU complex + interconnect (Tier A) ---
  - { block: "6x Cortex-A55 (application cluster)", tier: A, test: boot,                     evidence: "Boots stock NXP + mainline Linux to userspace on all six cores" }
  - { block: "Cortex-M33 System Manager (real SM fw)", tier: A, test: boot,                  evidence: "Runs real NXP SM firmware; Linux's sole SCMI provider over MU" }
  - { block: "Cortex-M7 (real-time domain)",       tier: A, test: "harness:m7-rpmsg",        evidence: "SM boots/manages/fault-recovers it; imx_rpmsg_pingpong 100-msg round-trip" }
  - { block: "GICv3 + ITS",                        tier: A, test: boot,                       evidence: "Underpins boot + MSI-X for NETC/PCIe" }
  - { block: "U-Boot boot chain + network boot",   tier: A, test: "harness:uboot",             evidence: "ROM tables -> SM -> SPL -> U-Boot off eMMC; prompt writes eMMC + TFTPs a kernel over ENETC and booti's it to Linux userspace" }
  - { block: "MU mailbox cross-connect",           tier: A, test: boot,                       evidence: "SCMI + rpmsg + ELE transports" }
  - { block: "eDMA v3/v5",                         tier: A, test: "qtest:imx95-edma-test",    evidence: "Real TCD src->dst moves; audio FIFO drain, SPI/I2C, full-duplex interleave" }
  # --- Networking (Tier A) ---
  - { block: "ENETC x3 (2x1G + 10G)",              tier: A, test: "qtest:fsl-enetc-test",     evidence: "BD-ring DMA + MSI-X via ITS; links + traffic; board-to-board" }
  - { block: "NETC EMDIO + AQR113C + xPCS (10G real chain)", tier: A, test: "harness:netc-real10g", evidence: "Stock 10G node links @10Gbps through the real PHY chain (v2.4.0)" }
  - { block: "NETC Timer (IEEE 1588 PHC)",         tier: A, test: "harness:ptp",               evidence: "ptp_netc binds at 0002:00:18.0; PHC registers and TMR_CUR_TIME advances", caveat: "PPS/periodic-output/external-timestamp capture not modelled" }
  # --- Storage (Tier A) ---
  - { block: "uSDHC (SD + eMMC)",                  tier: A, test: "harness:sd-emmc",          evidence: "SDHCI/ADMA block r/w; ext4 mmcblk r/w/sync; Weston off eMMC rootfs" }
  - { block: "FlexSPI + serial NOR",               tier: A, test: boot,                       evidence: "JEDEC + read; boots from real flash contents" }
  # --- DMA'd datapaths + console (Tier A) ---
  - { block: "LPUART x8",                          tier: A, test: boot,                       evidence: "Console on ttyLP0; LPUART3 RX-DMA drives the UART interconnect" }
  # --- Display / GPU 2D (Tier A) ---
  - { block: "DPU display + compositing",          tier: A, test: "harness:dpu-display",      evidence: "FetchLayer/FrameGen scanout, LayerBlend compositing, six-Tux boot logo" }
  - { block: "DPU 2D blit engine",                 tier: A, test: "qtest:imx95-blit-test",    evidence: "copy/fill/Porter-Duff blend/scale/rotate/CSC compute to guest memory" }
  - { block: "LVDS (LDB) display output",          tier: A, test: "harness:dpu-display",      evidence: "dpu95 binds LVDS-1, panel scanout" }
  # --- Audio (Tier A) ---
  - { block: "SAI3 + WM8962 playback",             tier: A, test: "harness:audio-playback",   evidence: "square wave -> eDMA -> SAI FIFO -> wav byte-checked" }
  - { block: "MICFIL PDM capture",                 tier: A, test: "harness:audio-capture",    evidence: "real PDM samples to userspace" }
  - { block: "SPDIF / XCVR (playback)",            tier: A, test: boot,                       evidence: "audio transceiver playback datapath" }
  # --- Camera (Tier A) ---
  - { block: "MIPI CSI-2 -> ISI (capture)",        tier: A, test: "harness:camera",     evidence: "5 byte-checked UYVY frames off /dev/video0" }
  - { block: "Virtual camera (host-frame source)", tier: A, test: "harness:camera",           evidence: "ISI scans real host frames into V4L2 buffers" }
  # --- PCIe (Tier A) ---
  - { block: "PCIe RC pcie0 + pcie1 (DWC)",        tier: A, test: "harness:pcie",             evidence: "link up + enumeration; arbitrary endpoint bind + MSI-X via ITS + DMA" }
  # --- Accelerator w/ real compute (Tier A) ---
  - { block: "HW JPEG codecs (enc + dec)",         tier: A, test: "qtest:imx95-jpeg-test",                       evidence: "mxc-jpeg /dev/video2,3; libjpeg encode/decode or honest error" }
  # --- Buses (Tier A) ---
  - { block: "LPI2C x8 + slaves",                  tier: A, test: boot,   evidence: "codec/PMIC/expander answer; master IRQ path" }
  - { block: "LPSPI x8",                           tier: A, test: "qtest:imx95-lpspi-test",   evidence: "per-bus SSI master; JEDEC byte-exact; eDMA-driven; board-to-board SPI" }
  - { block: "I3C x2 (Silvaco)",                   tier: A, test: boot,     evidence: "I3C master bridges to legacy I2C" }
  - { block: "FlexCAN x5",                         tier: A, test: "qtest:flexcan-test", evidence: "can0 up; frame round-trip; board-to-board CAN" }
  # --- GPIO / PWM / analog (Tier A) ---
  - { block: "RGPIO x5",                           tier: A, test: "harness:gpio",             evidence: "line get/set; card-detect via GPIO3" }
  - { block: "TPM PWM",                            tier: A, test: boot,                       evidence: "both TPM PWM blocks drive duty/period" }
  - { block: "ADC",                                tier: A, test: "harness:adc",              evidence: "operator-settable adc-chN QOM props; injection verified (was silent-wrong, fixed)" }
  # --- Misc functional (Tier A) ---
  - { block: "Watchdog (WDOG3)",                   tier: A, test: boot,                       evidence: "i.MX7ULP-style wdog; SDCLK auto-gate quirk" }
  - { block: "virtio-mmio + 9p host share",        tier: A, test: "harness:virtio-9p",        evidence: "4 virtio-mmio transports; 9p host share mounts e2e" }

  # --- Registration bar / bring-up (Tier B) ---
  - { block: "ChipIdea USB2 host (usb-kbd)",       tier: B, test: "harness:usb",              evidence: "usb-kbd enumerates as HID; VBUS expander on lpi2c7" }
  - { block: "USB3 SuperSpeed (DWC3)",             tier: B, test: boot,                       evidence: "snps,dwc3 core binds" }
  - { block: "MIPI-DSI display output",            tier: B, test: boot,                       evidence: "dw-mipi-dsi -> rm67191 panel; card0-DSI-1 comes up" }
  - { block: "NeoISP (camera ISP)",                tier: B, test: boot,                       evidence: "ISP driver binds" }
  - { block: "DDR PMU",                            tier: B, test: boot,                       evidence: "perf PMU driver binds" }
  - { block: "OCOTP eFuse + EdgeLock ELE",         tier: B, test: boot,                       evidence: "ELE responder (GET_INFO/RANDOM real entropy); fuse shadow seeded" }
  - { block: "Clocks/power/reset (CCM/ANATOP/SRC via SM)", tier: B, test: boot,               evidence: "programmed by the SM; Linux reads real rates over SCMI" }
  - { block: "Audio capture bring-up (BT-SCO + SAI RX)", tier: B, test: boot,                 evidence: "cards register; no codec ADC-DAPM route (documented, known-limitations sec.7)" }

  # --- Registration only, compute proprietary (Tier C) ---
  - { block: "Mali-G310 GPU (Valhall CSF)",        tier: C, test: "qtest:imx95-mali-test",    evidence: "kbase identifies GPU arch 10.12.0, then fails CSF bring-up cleanly (-EIO)", caveat: "compute needs proprietary libmali" }
  - { block: "VPU (Wave6 / cnm633c)",              tier: C, test: boot,                       evidence: "wave6-vpu binds, /dev/video* present; no codec firmware -> no frames", caveat: "decode/encode is proprietary firmware" }
  - { block: "Neutron NPU",                        tier: C, test: "qtest:imx95-neutron-test",                       evidence: "driver binds e2e; default-on guest honest-fault via MBOX1 error_code (qom-set 0 to opt out)", caveat: "compute is NXP-proprietary; flagged, do not trust NPU output" }

absent:
  - { block: "FEC / ENET (dwmac)",  reason: "i.MX 95 networking is ENETC (NETC), not the FEC/EQOS pair of i.MX 91/93" }
  - { block: "EQOS (DWMAC)",        reason: "same — ENETC replaces it on the i.MX 95" }
  - { block: "LCDIFv3 (parallel-RGB)", reason: "i.MX 95 display is the DPU (+ LVDS/DSI), not a parallel-RGB LCDIF" }
  - { block: "PXP 2D engine",       reason: "i.MX 95 2D acceleration is the DPU blit engine, not PXP" }
  - { block: "Ethos-U65 NPU",       reason: "the i.MX 95 NPU is the NXP Neutron, not Arm Ethos-U65 (that is the i.MX 93)" }

